name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          mkdir -p tools
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -o -q rojo.zip -d tools
          curl -sSL -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.0/luau-lsp-linux-x86_64.zip
          unzip -o -q lsp.zip -d tools
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -o -q luau.zip -d tools
          curl -sSL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip -o -q stylua.zip -d tools
          chmod +x tools/*
          echo "$PWD/tools" >> "$GITHUB_PATH"

      - name: Format, build, type check, tests
        run: scripts/check.sh

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: KaijuKeepers-place
          path: build/KaijuKeepers.rbxlx
