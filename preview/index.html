<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Titan Clash Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
  [hidden] { display: none !important; }
  :root {
    color-scheme: dark;
    --ink: #121622;
    --panel: rgba(16, 20, 32, 0.84);
    --panel-solid: #1a1f2e;
    --line: rgba(255, 255, 255, 0.14);
    --text: #f4f2ff;
    --muted: #a8adc7;
    --gold: #ffc83d;
    --green: #5ee27a;
    --red: #ff5a5a;
    --display: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; }
  .display { font-family: var(--display); }

  .topbar { position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
  .brand { display: grid; gap: 3px; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(24px, 3.4vw, 34px); line-height: 1; color: var(--gold); text-shadow: 0 3px 0 #7a1b00, 0 0 18px rgba(0,0,0,.5); -webkit-text-stroke: 1.5px #3a0f00; }
  .brand p { margin: 0; font-family: var(--display); font-size: 14px; text-shadow: 0 1px 3px #000; }
  .stats { pointer-events: auto; display: grid; gap: 6px; justify-items: end; }
  .pill { background: var(--panel); border: 2px solid var(--c, var(--line)); border-radius: 14px; padding: 5px 14px; font-family: var(--display); font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .pill b { font-size: 21px; color: var(--c, #fff); }
  .pill span { font-size: 13px; color: var(--green); }
  .pill.pop { animation: pop .3s ease; }
  @keyframes pop { 40% { transform: scale(1.12); } }
  .foods { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 260px; }
  .foods i { font-style: normal; font-family: var(--display); font-size: 12px; background: var(--panel); border: 1.5px solid var(--c); color: #fff; border-radius: 999px; padding: 1px 8px; }

  .goals { position: fixed; left: 16px; top: calc(92px + env(safe-area-inset-top, 0px)); width: 230px; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 6px; }
  .goals h2 { margin: 0 0 2px; font-family: var(--display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .goal { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: center; font-family: var(--display); font-size: 14.5px; }
  .goal .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: #2a3044; border: 2px solid #4a5270; }
  .goal.now .n { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 10px rgba(255, 200, 60, .6); }
  .goal.now { color: #fff; }
  .goal.done { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
  .goal.done .n { background: var(--green); border-color: var(--green); color: #0b2a12; }
  .goals .hint { font-size: 12.5px; color: var(--muted); line-height: 1.4; border-top: 1px solid var(--line); padding-top: 6px; }
  .goals kbd { font-family: var(--display); background: #2a3044; border: 1px solid #4a5270; border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; font-size: 11.5px; color: #fff; }

  .bar { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(720px, calc(100% - 32px)); }
  .btn { font-family: var(--display); font-weight: 600; font-size: 15px; color: #fff; background: var(--b, #3b6fd8); border: 2px solid #000; border-radius: 12px; padding: 9px 14px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.25); text-shadow: 0 1px 0 rgba(0,0,0,.6); transition: transform .08s ease; }
  .btn.big { font-size: 18px; padding: 11px 20px; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.55); }
  .btn:focus-visible, .act:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* In-world interaction prompt (Roblox ProximityPrompt style) */
  .prompt { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 10px; background: rgba(12, 14, 22, .82); border: 2px solid rgba(255,255,255,.25); border-radius: 14px; padding: 7px 14px 7px 7px; pointer-events: auto; cursor: pointer; touch-action: none; }
  .prompt .key { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; background: conic-gradient(var(--gold) calc(var(--p, 0) * 1turn), rgba(255,255,255,.15) 0); }
  .prompt .key::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #1b1f2c; }
  .prompt .key span { position: relative; }
  .prompt b { display: block; font-family: var(--display); font-size: 17px; }
  .prompt small { display: block; font-size: 12.5px; color: var(--muted); max-width: 30ch; }
  .prompt.bad { animation: shake .3s; border-color: var(--red); }
  @keyframes shake { 25% { transform: translate(-54%, -100%); } 75% { transform: translate(-46%, -100%); } }
  .pointer { position: fixed; left: 0; top: 0; transform: translate(-50%, -50%); font-family: var(--display); font-size: 13px; text-align: center; pointer-events: none; color: #fff; text-shadow: 0 1px 3px #000; max-width: 110px; }
  .pointer .arrow { width: 0; height: 0; margin: 0 auto 2px; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 22px solid var(--c, var(--gold)); filter: drop-shadow(0 0 6px var(--c, var(--gold))); }

  /* Battle HUD */
  .bhud { position: fixed; left: 50%; top: calc(86px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(460px, calc(100% - 32px)); background: var(--panel); border: 2px solid var(--red); border-radius: 14px; padding: 8px 12px 10px; display: grid; gap: 5px; }
  .bhud .timer { text-align: center; font-family: var(--display); color: var(--gold); font-size: 16px; font-variant-numeric: tabular-nums; }
  .bhud .row { display: grid; grid-template-columns: 42% 1fr; gap: 8px; align-items: center; font-family: var(--display); font-size: 14px; }
  .bhud .hp { position: relative; height: 18px; background: #1e2130; border-radius: 8px; overflow: hidden; }
  .bhud .hp i { position: absolute; inset: 0 auto 0 0; background: var(--hp, #5ad86e); border-radius: 8px; transition: width .15s ease; }
  .bhud .hp span { position: relative; display: block; text-align: center; font-size: 12px; line-height: 18px; text-shadow: 0 1px 2px #000; }
  .countdown { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--display); font-size: clamp(60px, 14vw, 140px); color: var(--gold); -webkit-text-stroke: 3px #3a1a00; text-shadow: 0 6px 0 #7a3b00, 0 0 40px rgba(255,200,60,.6); pointer-events: none; }
  .actions { position: fixed; right: 22px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 12px; }
  .act { position: relative; overflow: hidden; border-radius: 50%; border: 3px solid #000; color: #fff; font-family: var(--display); font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.5), inset 0 3px 0 rgba(255,255,255,.25); text-shadow: 0 1px 0 #000; line-height: 1.1; touch-action: none; }
  .act.attack { width: 100px; height: 100px; background: #e04a4a; font-size: 16px; }
  .act.special { width: 84px; height: 84px; background: #9a5ae0; font-size: 13px; }
  .act.use { width: 84px; height: 84px; background: #2f9a52; font-size: 16px; }
  .act .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.55); pointer-events: none; }
  .act span { position: relative; }
  .dpad { position: fixed; left: 20px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
  .dpad button { border-radius: 12px; border: 2px solid #000; background: rgba(40,46,66,.85); color: #fff; font-size: 22px; touch-action: none; }

  .banner { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -30px) scale(.9); background: var(--panel-solid); border: 3px solid var(--c, var(--gold)); border-radius: 18px; padding: 12px 24px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .35s cubic-bezier(.2, 1.4, .4, 1); width: min(540px, calc(100% - 32px)); box-shadow: 0 0 40px var(--c, var(--gold)); }
  .banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .banner b { display: block; font-family: var(--display); font-size: 28px; color: var(--c, var(--gold)); text-shadow: 0 0 16px var(--c, var(--gold)); }
  .banner span { font-size: 14.5px; }
  .toasts { position: fixed; left: 50%; top: calc(84px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; pointer-events: none; width: calc(100% - 32px); }
  .toast { background: var(--panel-solid); border: 2px solid var(--c, #fff); color: var(--c, #fff); font-family: var(--display); font-weight: 600; font-size: 15px; padding: 7px 16px; border-radius: 12px; max-width: 560px; text-align: center; animation: toast 3.2s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 30, .75) 100%); }
  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #confetti div { position: absolute; top: -20px; width: 10px; height: 16px; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); font-family: var(--display); font-size: 20px; color: var(--gold); transition: opacity .5s ease; }
  .loading.done { opacity: 0; pointer-events: none; }
  .error { color: #ffb4b4; font-size: 15px; max-width: 40ch; text-align: center; line-height: 1.5; }

  /* ---- Simulator-game style (big outlined text, glossy chunky buttons) ---- */
  .stroke { -webkit-text-stroke: 5px #0b0d14; paint-order: stroke fill; }
  .money { position: fixed; left: 14px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 0; font-family: var(--display); font-weight: 700; font-style: italic; pointer-events: none; }
  .money .food { font-size: 24px; color: #ffb36b; }
  .money .cash { font-size: 44px; color: #7dff5a; line-height: 1.05; }
  .money .inc { font-size: 19px; color: #d6ffcc; }
  .money .pop { animation: pop .3s ease; }
  .event { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); text-align: center; font-family: var(--display); font-weight: 700; pointer-events: none; }
  .event .name { font-size: 15px; color: #fff; letter-spacing: .04em; }
  .event .time { font-size: 30px; color: #fff; line-height: 1; }
  .side { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(2, 66px); gap: 10px; }
  .sq { position: relative; width: 66px; height: 66px; border-radius: 12px; border: 3px solid #000; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 45%, rgba(0,0,0,.18)), var(--b); color: #fff; font-family: var(--display); font-weight: 700; cursor: pointer; display: grid; place-items: center; padding: 4px 0 2px; box-shadow: 0 4px 0 rgba(0,0,0,.45); transition: transform .08s ease; }
  .sq .ic { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); }
  .sq .lb { font-size: 12.5px; -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
  .sq:hover { transform: scale(1.06); }
  .sq:active { transform: scale(.93); }
  .sq.wide { grid-column: span 2; width: auto; height: 56px; grid-auto-flow: column; gap: 8px; justify-content: center; font-size: 19px; }
  .sq.wide .ic { font-size: 24px; }
  .sq.wide .lb { font-size: 19px; }
  .hotbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }
  .slot { position: relative; width: 58px; height: 58px; border-radius: 8px; background: rgba(30, 34, 30, .62); border: 2px solid rgba(255,255,255,.12); display: grid; place-items: center; cursor: pointer; font-family: var(--display); color: #fff; }
  .slot[aria-pressed="true"] { border-color: #ffd23c; box-shadow: 0 0 0 2px #000, 0 0 14px rgba(255, 210, 60, .6); }
  .slot .n { position: absolute; left: 4px; top: 1px; font-size: 11px; -webkit-text-stroke: 2.5px #000; paint-order: stroke fill; }
  .slot .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #000; background: var(--c); box-shadow: inset -4px -5px 0 rgba(0,0,0,.25), inset 3px 3px 0 rgba(255,255,255,.4); }
  .slot .c { position: absolute; right: 4px; bottom: 1px; font-size: 13px; -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
  .slot.empty { opacity: .45; }
  .goals { background: rgba(255,255,255,.92); color: #1b1f2c; border: 3px solid #000; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .goals h2 { color: #6a6f86; }
  .goal.now { color: #000; }
  .goal .n { background: #e9ebf3; border-color: #9aa0b8; color: #1b1f2c; }
  .goal.now .n { background: #ffd23c; border-color: #000; color: #000; box-shadow: none; }
  .goal.done { color: #9aa0b8; }
  .goals .hint { color: #5c6178; border-top-color: #d8dbe6; }
  .goals kbd { color: #1b1f2c; background: #eef0f6; border-color: #b7bccf; }

  @media (max-width: 760px) {
    .money { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    .money .cash { font-size: 30px; }
    .money .food, .money .inc { font-size: 15px; }
    .side { top: auto; bottom: calc(260px + env(safe-area-inset-bottom, 0px)); transform: none; grid-template-columns: repeat(2, 54px); gap: 7px; }
    .sq { width: 54px; height: 54px; }
    .sq .ic { font-size: 21px; }
    .sq .lb { font-size: 10.5px; }
    .slot { width: 37px; height: 40px; }
    .hotbar { gap: 3px; }
    .slot .dot { width: 16px; height: 16px; }
    .slot .c { font-size: 11px; }
    .brand { display: none; }
    .brand p { display: none; }
    .goals { top: calc(52px + env(safe-area-inset-top, 0px)); bottom: auto; left: 16px; right: 16px; width: auto; padding: 6px 10px; grid-template-columns: 1fr; }
    .goals .goal:not(.now), .goals .hint, .goals h2 { display: none; }
    .pill { padding: 3px 10px; }
    .pill b { font-size: 16px; }
    .foods { display: none; }
    .btn { font-size: 13px; padding: 7px 10px; }
    .btn.big { font-size: 14px; padding: 8px 12px; }
    .actions { right: 12px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
    .dpad { left: 12px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
  }
  @media (prefers-reduced-motion: reduce) { .banner, .btn { transition: none; } .toast { animation-duration: 3.2s; } }
</style>

<canvas id="scene" aria-label="Playable 3D preview of Titan Clash"></canvas>

<header class="topbar">
  <div class="brand">
    <h1>Titan Clash</h1>
    <p>🔍 Find titans · 🍖 Feed them · ⚔️ Fight</p>
  </div>

</header>

<section class="goals" id="goals" aria-label="Goals">
  <h2>Your goals</h2>
  <div id="goal-list"></div>
  <div class="hint" id="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Space</kbd> jump · hold <kbd>E</kbd> to tame/feed · drag to turn the camera</div>
</section>

<div class="money" aria-live="polite">
  <div class="food stroke" id="food">🍖 0</div>
  <div class="cash stroke" id="cash">💵 $0</div>
  <div class="inc stroke" id="income">+$0/s</div>
</div>
<div class="event" id="event"><div class="name stroke" id="event-name"></div><div class="time stroke" id="event-time"></div></div>
<div class="side" id="bar" role="group" aria-label="Actions">
  <button class="sq wide" id="fight" style="--b:#e03434"><span class="ic">⚔️</span><span class="lb">FIGHT!</span></button>
  <button class="sq" id="watch" style="--b:#2f8ff0"><span class="ic">🍿</span><span class="lb">Watch</span></button>
  <button class="sq" id="rush" style="--b:#3cc24a"><span class="ic">🌟</span><span class="lb">Rush</span></button>
  <button class="sq" id="meteor" style="--b:#ff8a1f"><span class="ic">☄️</span><span class="lb">Meteor</span></button>
  <button class="sq" id="mutate" style="--b:#a85cff"><span class="ic">🧬</span><span class="lb">Mutate</span></button>
</div>
<div class="hotbar" id="foods" aria-label="Food (click to choose what to feed first)"></div>

<div class="prompt" id="prompt" hidden><div class="key"><span id="prompt-key">E</span></div><div><b id="prompt-action"></b><small id="prompt-object"></small></div></div>
<div id="pointers"></div>

<div class="bhud" id="bhud" hidden><div class="timer" id="btimer"></div><div id="brows"></div></div>
<div class="countdown" id="countdown" hidden></div>
<div class="actions" id="actions" hidden>
  <button class="act special" id="act-special"><div class="cd" id="cd-special"></div><span id="special-name">✨<br>Special</span></button>
  <button class="act attack" id="act-attack"><div class="cd" id="cd-attack"></div><span>👊<br>Attack</span></button>
</div>
<div class="actions" id="explore-actions" hidden>
  <button class="act special" id="act-jump" style="background:#3b6fd8"><span>⬆️<br>Jump</span></button>
</div>
<div class="dpad" id="dpad" hidden>
  <span></span><button data-dir="up" aria-label="Move forward">▲</button><span></span>
  <button data-dir="left" aria-label="Move left">◀</button><span></span><button data-dir="right" aria-label="Move right">▶</button>
  <span></span><button data-dir="down" aria-label="Move back">▼</button><span></span>
</div>

<div class="banner" id="banner"><b id="banner-title"></b><span id="banner-text"></span></div>
<div class="toasts" id="toasts"></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="confetti"></div>
<div class="loading" id="loading"><div>Building Titan Island…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
  "use strict";
  const loadingEl = document.getElementById("loading");
  if (!window.THREE || !THREE.OrbitControls) {
    loadingEl.innerHTML = '<div class="error">The 3D library could not load. Check your connection and reload the page.</div>';
    return;
  }

  // ---------------------------------------------------------------------
  // Game data (mirrors src/shared/Config/*.lua and shared/Game/Battle.lua)
  // ---------------------------------------------------------------------
  const rgb = (r, g, b) => (r << 16) | (g << 8) | b;
  const RARITY = {
    Common: rgb(200, 200, 200), Rare: rgb(70, 150, 255), Epic: rgb(175, 90, 255),
    Legendary: rgb(255, 175, 0), Mythic: rgb(255, 60, 95), Secret: rgb(20, 255, 200),
  };
  // Rarities.lua: { WildWeight, TameTime, TameFood, TameChance }
  const RARITY_WILD = {
    Common: [60, 1, 1, 1], Rare: [26, 2, 2, 0.85], Epic: [10, 3, 4, 0.7],
    Legendary: [3, 4.5, 6, 0.55], Mythic: [0.8, 6, 10, 0.4], Secret: [0.2, 8, 15, 0.3],
  };
  const RARITY_ORDER = { Common: 1, Rare: 2, Epic: 3, Legendary: 4, Mythic: 5, Secret: 6 };
  const CREATURES = {

            f.moving = to.length() > reach;
            if (f.moving) f.pos.addScaledVector(f.look, f.st.speed * 0.8 * sdt);
            if (to.length() <= reach * 1.2) { if (t - f.lastSp >= f.sp.cd * 1.5) act(f, "Special"); else if (t - f.lastAtk >= BATTLE.attackCd * 1.8) act(f, "Attack"); }
          }
        }
      }
      f.pos.addScaledVector(f.vel, sdt); f.vel.multiplyScalar(Math.max(0, 1 - 5 * sdt));
      const lim = ARENA.fight - 4; f.pos.x = Math.max(-lim, Math.min(lim, f.pos.x)); f.pos.z = Math.max(-lim, Math.min(lim, f.pos.z)); // square fighting zone
      let y = FLOOR;
      if (t - f.jumpAt < 0.6) y += Math.sin(Math.PI * (t - f.jumpAt) / 0.6) * 10 * Math.sqrt(f.st.scale);
      if (f.moving && f.alive) y += Math.abs(Math.sin(t * 9)) * 0.5 * Math.sqrt(f.st.scale);
      if (t - f.kj.bounceAt < 0.3) y += Math.sin(Math.PI * (t - f.kj.bounceAt) / 0.3) * 1.5;
      f.kj.group.position.set(f.pos.x, y, f.pos.z);
      f.kj.group.rotation.y = Math.atan2(-f.look.x, -f.look.z);
      f.kj.body.rotation.z = f.alive ? 0 : rad(80);
      const squash = t - f.hitAt < 0.18 ? 1 - Math.sin(Math.PI * (t - f.hitAt) / 0.18) * 0.18 : 1; // hit squash
      f.kj.body.scale.set(f.st.scale * (2 - squash), f.st.scale * squash, f.st.scale * (2 - squash));
    }
    if (match.phase === "fight" && (match.fighters.filter((f) => f.alive).length <= 1 || t >= match.endsAt)) finishMatch();
    if (match.player) {
      const p = match.player;
      document.getElementById("cd-attack").style.height = Math.max(0, 1 - (t - p.lastAtk) / BATTLE.attackCd) * 100 + "%";
      document.getElementById("cd-special").style.height = Math.max(0, 1 - (t - p.lastSp) / p.sp.cd) * 100 + "%";
    }
    const focus = match.player ? match.player.pos : match.fighters[0].pos.clone().add(match.fighters[1].pos).multiplyScalar(0.5);
    followTarget(new THREE.Vector3(focus.x, ARENA.y + 10, focus.z), dt, 4);
  }
  // Click = attack in a practice battle (dragging still turns the camera)
  let downAt = 0, downX = 0, downY = 0;
  canvas.addEventListener("pointerdown", (e) => { downAt = now(); downX = e.clientX; downY = e.clientY; });
  canvas.addEventListener("pointerup", (e) => { if (match && match.player && e.pointerType === "mouse" && now() - downAt < 0.25 && Math.hypot(e.clientX - downX, e.clientY - downY) < 6) act(match.player, "Attack"); });
  document.getElementById("act-attack").addEventListener("click", () => match && match.player && act(match.player, "Attack"));
  document.getElementById("act-special").addEventListener("click", () => match && match.player && act(match.player, "Special"));

  // ---------------------------------------------------------------------
  // Camera (third person follow with OrbitControls)
  // ---------------------------------------------------------------------
  function moveInput() {
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    const right = new THREE.Vector3(-fwd.z, 0, fwd.x), move = new THREE.Vector3();
    if (keys.up) move.add(fwd); if (keys.down) move.sub(fwd); if (keys.right) move.add(right); if (keys.left) move.sub(right);
    return move.lengthSq() > 0 ? move.normalize() : move;
  }
  function followTarget(target, dt, speed) {
    const delta = target.clone().sub(controls.target).multiplyScalar(speed ? Math.min(1, dt * speed) : 1);
    controls.target.add(delta); camera.position.add(delta);
  }
  function cameraTo(target, offset) { controls.target.copy(target); camera.position.copy(target).add(offset); }
  function snapCamera() {
    const back = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw)).multiplyScalar(40);
    cameraTo(player.pos.clone().add(new THREE.Vector3(0, 4, 0)), back.add(new THREE.Vector3(0, 40, 0)));
  }

  function updatePlayer(t, dt) {
    const move = moveInput(), speed = 18;
    player.pos.addScaledVector(move, speed * dt);
    if (move.lengthSq() > 0) {
      const want = Math.atan2(-move.x, -move.z);
      let d = want - player.yaw; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
      player.yaw += d * Math.min(1, dt * 14); player.walk += dt * 10;
    } else player.walk *= 0.8;
    collide(player.pos);
    const ground = groundHeight(player.pos);
    if (jumpQueued && player.grounded) { player.vy = 36; player.grounded = false; }
    jumpQueued = false;
    player.vy -= 110 * dt; player.pos.y += player.vy * dt;
    if (player.pos.y <= ground) { player.pos.y = ground; player.vy = 0; player.grounded = true; }
    const g = player.group; g.position.copy(player.pos); g.rotation.y = player.yaw;
    const swing = Math.sin(player.walk) * (move.lengthSq() > 0 ? 0.8 : 0);
    player.parts.legL.rotation.x = swing; player.parts.legR.rotation.x = -swing; player.parts.armL.rotation.x = -swing; player.parts.armR.rotation.x = swing;
    for (const f of [...foods]) if (f.base.distanceTo(player.pos.clone().setY(2)) < 5) collectFood(f);
    if (Math.hypot(player.pos.x, player.pos.z) < 6 && t - (state.portalAt || 0) > 3) { state.portalAt = t; startMatch("practice"); return; }
    followTarget(player.pos.clone().add(new THREE.Vector3(0, 4, 0)), dt, 0);
  }

  // ---------------------------------------------------------------------
  // Buttons
  // ---------------------------------------------------------------------
  document.getElementById("fight").addEventListener("click", () => startMatch("practice"));
  document.getElementById("watch").addEventListener("click", () => startMatch("watch"));
  document.getElementById("rush").addEventListener("click", () => {
    if (match) endMatch(false);
    banner("🌟 WILD RUSH", "Wild titans are everywhere and rare ones are 3x more common!", rgb(120, 255, 150));
    const near = Math.atan2(player.pos.z, player.pos.x) * 180 / Math.PI;
    for (let i = 0; i < 6; i++) later(0.5 + i * 0.4, () => spawnWild(pickWeighted(wildPool(3)), undefined, randomFieldPoint(near - 35, near + 35)));
  });
  document.getElementById("meteor").addEventListener("click", () => {
    if (match) endMatch(false);
    banner("☄️ METEOR FEAST", "Food is falling from the sky! Grab it!", rgb(255, 150, 50));
    const near = Math.atan2(player.pos.z, player.pos.x) * 180 / Math.PI;
    const pool = ["Meat", "GoldenApple", "Fish", "FirePepper", "CrystalFruit", "StarFood"];
    for (let i = 0; i < 14; i++) later(0.8 + i * 0.18, () => {
      const target = randomFieldPoint(near - 25, near + 25); target.y = 0.2;
      const id = pool[Math.floor(Math.random() * pool.length)];
      shockwave(target, RED, 5, 1.3);
      const rock = new THREE.Group(); ball(rock, 3, T(0, 0, 0), rgb(255, 120, 40), { basic: true });
      const start = target.clone().add(new THREE.Vector3(rnd(-60, 60), 160, rnd(-60, 60)));
      addFx(rock, (t) => {
        const k = Math.min(1, t / 1.3); rock.position.lerpVectors(start, target, k * k);
        POOL.glow.emit(rock.position, { vel: [0, 4, 0], life: 0.5, size: 4, endSize: 1, color: Math.random() < 0.5 ? rgb(255, 200, 60) : rgb(255, 90, 20) });
        if (k >= 1) { Presets.MeteorImpact(target, FOODS[id].color); const d = camera.position.distanceTo(target); if (d < 200) shake(0.8 * (1 - d / 200), 0.3); spawnFood(id, target); return false; }
        return true;
      });
    });
  });
  const mutationCycle = ["Lava", "Crystal", "Shadow", "Golden", "Rainbow", null];
  let mutationIndex = 0;
  document.getElementById("mutate").addEventListener("click", () => {
    if (match) endMatch(true);
    const kj = fighterTitan();
    if (worldOf(kj.group).distanceTo(player.pos) > 60) { flash(0xffffff, 0.4, 0.8); placePlayer(yourEntrance(), new THREE.Vector3(0, 0, 0)); snapCamera(); }
    later(0.3, () => {
      const next = mutationCycle[mutationIndex]; mutationIndex = (mutationIndex + 1) % mutationCycle.length;
      const color = next ? MUTATIONS[next].color : 0xffffff, ground = worldOf(kj.group);
      Presets.Mutation(ground.clone().add(new THREE.Vector3(0, heightOf(kj) * 0.6, 0)), ground, color, next || "Normal");
      later(0.45, () => { kj.mutation = next; applyLook(kj); refreshMyPlates(); updateHud(); if (next) toast(`🧬 ${next.toUpperCase()}! Stats x${MUTATIONS[next].stat}, income x${MUTATIONS[next].mult}`, color); });
    });
  });

  // ---------------------------------------------------------------------
  // Start + loop
  // ---------------------------------------------------------------------
  function resize() { resizeRender(window.innerWidth, window.innerHeight); }
  window.addEventListener("resize", resize); resize();
  setMode("explore"); snapCamera(); updateHud(); checkGoals();
  // A common wild titan close to your base so the first "find" is quick, plus more around the fields.
  spawnWild("Gloop", null, randomFieldPoint(yourAngle - 8, yourAngle + 8));
  for (let i = 0; i < 6; i++) spawnWild();
  later(20, () => spawnWild(pickWeighted(wildPool(1, 4)), undefined, randomFieldPoint(yourAngle - 40, yourAngle + 40)));
  setInterval(() => { if (wilds.length < 9) spawnWild(); }, 14000);
  setInterval(() => spawnWild(pickWeighted(wildPool(1, 3))), 55000); // a rare one now and then
  // Server events on a timer (EventService rotation), shown top-center like big simulator games
  const EVENTS = [["🌟 WILD RUSH", () => document.getElementById("rush").click()], ["☄️ METEOR FEAST", () => document.getElementById("meteor").click()]];
  let eventIndex = 0, nextEventAt = now() + 90;
  const eventName = document.getElementById("event-name"), eventTime = document.getElementById("event-time");
  setInterval(() => {
    const left = Math.max(0, Math.ceil(nextEventAt - now()));
    eventName.textContent = EVENTS[eventIndex][0] + " IN";
    eventTime.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
    if (left <= 0 && state.mode === "explore") { EVENTS[eventIndex][1](); eventIndex = (eventIndex + 1) % EVENTS.length; nextEventAt = now() + 150; }
  }, 250);
  toast("👋 Welcome! Walk with WASD. Find a wild titan in the fields and tame it with food.", GOLD);

  let last = now(), shakeOffset = new THREE.Vector3();
  // Adaptive quality: if the device struggles, lower resolution, then turn bloom off.
  const perf = { frames: 0, time: 0, step: 0 };
  function adaptQuality(dt) {
    if (perf.step >= 2) return;
    perf.frames++; perf.time += dt;
    if (perf.frames < 90) return;
    const avg = perf.time / perf.frames; perf.frames = 0; perf.time = 0;
    if (avg < 1 / 40) { perf.step = 2; return; }
    perf.step++;
    if (perf.step === 1) renderer.setPixelRatio(1);
    else if (bloom) { bloom = null; camera.layers.enable(FXL); }
    resize();
  }
  function frame() {
    requestAnimationFrame(frame);
    const t = now(), rawDt = t - last, dt = Math.min(0.05, rawDt); last = t;
    if (rawDt < 0.5) adaptQuality(rawDt);
    camera.position.sub(shakeOffset);
    if (state.mode === "explore") { updatePlayer(t, dt); updateWilds(t, dt); updateInteraction(t); }
    updateMatch(t, dt);
    updateIncome(t);
    controls.update();
    for (const k of baseTitans) {
      let bob = (Math.sin(t * 2 + k.seed) + 1) * 0.08 * k.scale;
      if (t - k.bounceAt < 0.35) bob += Math.sin(Math.PI * (t - k.bounceAt) / 0.35) * 1.2 * k.scale;
      if (k.home) k.group.position.y = k.home.y + bob;
      k.body.rotation.y = Math.sin(t * 0.6 + k.seed) * 0.25;
    }
    const hue = (t * 0.2) % 1;
    for (const kj of [...baseTitans, ...wilds.map((w) => w.kj)]) if (kj.mutation === "Rainbow") kj.body.traverse((o) => { if (o.isMesh && o.userData.paint === "Body") { o.material.color.setHSL(hue, 0.8, 0.55); o.material.emissive.setHSL(hue, 0.8, 0.3); } });
    for (const f of foods) { f.group.position.y = f.base.y + Math.sin(t * 2 + f.seed) * 0.4 + 0.4; f.group.rotation.y = t * 1.5 + f.seed; }
    updateAuras(t, dt);
    for (const p of pools) p.update(dt);
    updateFx(t, dt); updateLights(t);
    updatePointers();
    sun.position.set(controls.target.x + 250, 420, controls.target.z + 160); sun.target.position.copy(controls.target);
    if (t < shakeUntil) { const s = shakeStrength * ((shakeUntil - t) / 0.3); shakeOffset.set(rnd(-1, 1) * s, rnd(-1, 1) * s, rnd(-1, 1) * s); } else shakeOffset.set(0, 0, 0);
    camera.position.add(shakeOffset);
    const kick = t < fovKickUntil ? fovKick * ((fovKickUntil - t) / fovKickDur) : 0;
    if (Math.abs(camera.fov - (50 + kick)) > 0.01) { camera.fov = 50 + kick; camera.updateProjectionMatrix(); }
    renderFrame();
  }
  frame();
  loadingEl.classList.add("done");
  // Handy for poking at the preview from the browser console.
  window.__titanClash = { state, wilds, foods, player, yourBase, spawnWild, startMatch, feed, placePlayer, snapCamera, Presets, camera, controls, makeKaiju, scene };
})();
</script>
